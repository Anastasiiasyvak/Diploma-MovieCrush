name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

jobs:
  backend-check:
    name: Backend · TypeScript + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build (tsc -> dist)
        run: npm run build

  mobile-check:
    name: Mobile · TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  cf-service-check:
    name: CF Service · install + import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cf_service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cf_service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import check (src compiles & imports)
        working-directory: ./cf_service/src
        run: |
          python -c "import model; import database; print('CF imports OK')"

  docker-build:
    name: Docker · build images
    runs-on: ubuntu-latest
    needs: [backend-check, cf-service-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t moviecrush-backend:ci ./backend

      - name: Build CF service image
        run: docker build -t moviecrush-cf:ci ./cf_service